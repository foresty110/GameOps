spring:
  datasource:
    url: jdbc:h2:mem:gameops;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
  flyway:
    enabled: false
  data:
    redis:
      host: 127.0.0.1
      port: 16379

app:
  jwt:
    secret: test-secret-test-secret-test-secret-test-secret-32bytes
    access-expiration-minutes: 30
    refresh-expiration-days: 7
